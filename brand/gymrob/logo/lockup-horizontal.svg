<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" role="img" aria-label="GYMROB horizontal lockup">
  <title>GYMROB · primary horizontal lockup</title>

  <!-- LEFT: GR stamped tile -->
  <g transform="translate(40 50) scale(0.78)">
    <g transform="rotate(-1.5 128 128)">
      <rect x="20" y="20" width="216" height="216" rx="6" fill="#6f1812"/>
      <rect x="22" y="22" width="212" height="208" rx="5" fill="#a4271f"/>
      <rect x="34" y="34" width="188" height="188" rx="4" fill="none" stroke="#fefae0" stroke-width="7"/>
      <circle cx="50" cy="50" r="4" fill="#fefae0"/>
      <circle cx="206" cy="50" r="4" fill="#fefae0"/>
      <circle cx="50" cy="206" r="4" fill="#fefae0"/>
      <circle cx="206" cy="206" r="4" fill="#fefae0"/>
      <text x="129" y="171" text-anchor="middle" fill="#fefae0"
            font-family="Alfa Slab One, Rockwell, serif" font-size="132" letter-spacing="-8">GR</text>
    </g>
  </g>

  <!-- RIGHT: wordmark + names + support -->
  <g transform="translate(300 0)">
    <!-- top rule with stamped caps -->
    <line x1="6" y1="92" x2="700" y2="92" stroke="#fefae0" stroke-width="3"/>
    <rect x="6" y="86" width="16" height="12" fill="#fefae0"/>
    <rect x="684" y="86" width="16" height="12" fill="#fefae0"/>

    <g font-family="Alfa Slab One, Rockwell, serif" font-size="108" text-anchor="start">
      <text x="6" y="190" fill="#0e0a07" opacity="0.55">GYMROB</text>
      <text x="3" y="187" fill="#fefae0">GYMROB</text>
    </g>

    <line x1="6" y1="222" x2="700" y2="222" stroke="#fefae0" stroke-width="3"/>
    <rect x="6" y="216" width="16" height="12" fill="#fefae0"/>
    <rect x="684" y="216" width="16" height="12" fill="#fefae0"/>

    <text x="6" y="262" fill="#fefae0" font-family="JetBrains Mono, monospace" font-weight="700"
          font-size="22" letter-spacing="6">ROBIN CARRUTHERS</text>
    <text x="700" y="262" text-anchor="end" fill="#4687a6" font-family="JetBrains Mono, monospace" font-weight="700"
          font-size="22" letter-spacing="6">MUMBAI · IRON</text>
  </g>
</svg>

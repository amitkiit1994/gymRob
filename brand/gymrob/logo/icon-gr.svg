<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="GYMROB — GR monogram">
  <title>GYMROB · GR stamped monogram (icon)</title>
  <!-- icon-only mark: stamped red tile + cream bezel + interlocking slab GR.
       Production: outline the GR before manufacture (it is set in Alfa Slab One). -->
  <g transform="rotate(-1.5 128 128)">
    <!-- droppable red plate -->
    <rect x="20" y="20" width="216" height="216" rx="6" fill="#6f1812"/>
    <rect x="22" y="22" width="212" height="208" rx="5" fill="#a4271f"/>
    <!-- stamped bezel -->
    <rect x="34" y="34" width="188" height="188" rx="4" fill="none" stroke="#fefae0" stroke-width="7"/>
    <!-- corner rivets -->
    <circle cx="50" cy="50" r="4" fill="#fefae0"/>
    <circle cx="206" cy="50" r="4" fill="#fefae0"/>
    <circle cx="50" cy="206" r="4" fill="#fefae0"/>
    <circle cx="206" cy="206" r="4" fill="#fefae0"/>
    <!-- interlocking GR -->
    <text x="129" y="171" text-anchor="middle" fill="#fefae0"
          font-family="Alfa Slab One, Rockwell, serif" font-size="132"
          letter-spacing="-8">GR</text>
  </g>
</svg>

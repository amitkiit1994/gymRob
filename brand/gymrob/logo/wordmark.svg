<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 210" role="img" aria-label="GYMROB wordmark">
  <title>GYMROB · painted slab wordmark</title>
  <!-- hammered painted wordmark: stepped dark extrusion + cream face.
       Cream face = rocky.paper; designed for dark / red / brick grounds. -->
  <g font-family="Alfa Slab One, Rockwell, serif" font-size="132" text-anchor="middle">
    <text x="343" y="150" fill="#0e0a07" opacity="0.85">GYMROB</text>
    <text x="342" y="149" fill="#0e0a07" opacity="0.7">GYMROB</text>
    <text x="341" y="148" fill="#3a0d08">GYMROB</text>
    <text x="340" y="146" fill="#fefae0">GYMROB</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="GYMROB boxing-glove crest icon, one colour">
  <title>GYMROB — Boxing-Glove Crest (1-colour stamp)</title>

  <!-- ============================================================
       1-COLOUR STAMP PROOF. Single ink = mighty.red #a4271f on the
       page; every shape is either that ink or true knockout. This is
       the embroidery / emboss / die-cut / favicon master.
       Swap the two vars mentally to invert (paper-on-red).
       ============================================================ -->

  <defs>
    <g id="glove-m">
      <rect x="14" y="46" width="32" height="12" rx="2"/>
      <path d="M14 46 Q12 20 24 14 Q34 10 44 14 Q54 18 52 36 L52 46 Z"/>
      <ellipse cx="48" cy="40" rx="6" ry="9" transform="rotate(20 48 40)"/>
    </g>
    <path id="m-arc-top" d="M -86 0 A 86 86 0 0 1 86 0" fill="none"/>
    <path id="m-arc-bot" d="M -82 0 A 82 82 0 0 0 82 0" fill="none"/>
    <path id="m-star" d="M0 -9 L2.1 -2.9 8.6 -2.8 3.3 1.1 5.3 7.3 0 3.4 -5.3 7.3 -3.3 1.1 -8.6 -2.8 -2.1 -2.9 Z"/>
  </defs>

  <!-- INK = mighty.red. KNOCKOUT = transparent (shows page).
       For the proof we paint a single solid disc, then knock paper out of it. -->
  <g transform="translate(128 128) rotate(-3)">
    <!-- solid ink disc -->
    <circle cx="0" cy="0" r="120" fill="#a4271f"/>

    <!-- knock a thin rim line (negative) -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="#fefae0" stroke-width="0"/>
    <circle cx="0" cy="0" r="114" fill="none" stroke="#a4271f" stroke-width="0"/>

    <!-- teeth knocked OUT of the ink as paper notches -->
    <g fill="#fefae0">
      <g><rect x="-3" y="-120" width="6" height="11"/></g>
      <g transform="rotate(30)"><rect x="-3" y="-120" width="6" height="11"/></g>
      <g transform="rotate(60)"><rect x="-3" y="-120" width="6" height="11"/></g>
      <g transform="rotate(90)"><rect x="-3" y="-120" width="6" height="11"/></g>
      <g transform="rotate(120)"><rect x="-3" y="-120" width="6" height="11"/></g>
      <g transform="rotate(150)"><rect x="-3" y="-120" width="6" height="11"/></g>
      <g transform="rotate(180)"><rect x="-3" y="-120" width="6" height="11"/></g>
      <g transform="rotate(210)"><rect x="-3" y="-120" width="6" height="11"/></g>
      <g transform="rotate(240)"><rect x="-3" y="-120" width="6" height="11"/></g>
      <g transform="rotate(270)"><rect x="-3" y="-120" width="6" height="11"/></g>
      <g transform="rotate(300)"><rect x="-3" y="-120" width="6" height="11"/></g>
      <g transform="rotate(330)"><rect x="-3" y="-120" width="6" height="11"/></g>
    </g>

    <!-- ring band hoops knocked out -->
    <circle cx="0" cy="0" r="106" fill="none" stroke="#fefae0" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="72"  fill="none" stroke="#fefae0" stroke-width="2.5"/>

    <text fill="#fefae0" font-family="JetBrains Mono, monospace"
          font-size="20" letter-spacing="6" font-weight="700">
      <textPath href="#m-arc-top" startOffset="50%" text-anchor="middle">GYMROB</textPath>
    </text>
    <text fill="#fefae0" font-family="JetBrains Mono, monospace"
          font-size="15" letter-spacing="5" font-weight="700">
      <textPath href="#m-arc-bot" startOffset="50%" text-anchor="middle">MUMBAI · IRON</textPath>
    </text>

    <!-- seam stars knocked out -->
    <g fill="#fefae0">
      <use href="#m-star" transform="translate(-88 0)"/>
      <use href="#m-star" transform="translate(88 0)"/>
    </g>

    <!-- inner medallion: knock a paper ring, keep ink field inside -->
    <circle cx="0" cy="0" r="68" fill="none" stroke="#fefae0" stroke-width="2.5"/>

    <!-- hung gloves knocked OUT (paper), with ink lace-breaks for definition -->
    <g transform="translate(0 -2)">
      <circle cx="0" cy="-42" r="7" fill="none" stroke="#fefae0" stroke-width="4"/>
      <path d="M0 -35 L-19 -16 M0 -35 L19 -16" stroke="#fefae0"
            stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <g fill="#fefae0" stroke="#a4271f" stroke-width="2.5">
        <g transform="translate(-25 10) rotate(-14) scale(1.12) translate(-30 -36)">
          <use href="#glove-m"/>
        </g>
        <g transform="translate(25 10) rotate(14) scale(-1.12 1.12) translate(-30 -36)">
          <use href="#glove-m"/>
        </g>
      </g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="GYMROB boxing-glove crest">
  <title>GYMROB — Boxing-Glove Crest (primary lockup)</title>

  <!-- ============================================================
       BOXING-GLOVE CREST · territory #3
       A hand-stamped fight-club seal: a hung pair of gloves
       (reusing the brief's BOXING GLOVE path) inside a notched
       brass-edged seal, GYMROB slab alongside.

       1-COLOUR PROOF: every paper area is true knockout (negative
       space). Fill the whole file mighty.red on paper, or paper on
       red, and the gloves + ring text + wordmark all still read.
       Nothing relies on a second colour to be legible.

       Palette (brief §4 only): mighty.red #a4271f / red-cinder
       #6f1812 / shadow #0e0a07 / paper #fefae0 / leather #b49676
       / brass.edge #d4a14a / ring-blue #4687a6 (one cool accent).
       ============================================================ -->

  <defs>
    <!-- brief BOXING GLOVE path, built once, instanced + mirrored -->
    <g id="glove">
      <rect x="14" y="46" width="32" height="12" rx="2"/>
      <path d="M14 46 Q12 20 24 14 Q34 10 44 14 Q54 18 52 36 L52 46 Z"/>
      <ellipse cx="48" cy="40" rx="6" ry="9" transform="rotate(20 48 40)"/>
    </g>

    <!-- arcs for the seal ring text -->
    <path id="c3-arc-top" d="M -118 0 A 118 118 0 0 1 118 0" fill="none"/>
    <path id="c3-arc-bot" d="M -110 0 A 110 110 0 0 0 110 0" fill="none"/>

    <!-- five-point star, drawn once -->
    <path id="c3-star" d="M0 -11 L2.6 -3.6 10.5 -3.4 4.1 1.3 6.5 8.9 0 4.2 -6.5 8.9 -4.1 1.3 -10.5 -3.4 -2.6 -3.6 Z"/>
  </defs>

  <!-- ================= THE SEAL ================= -->
  <!-- whole seal tipped -3deg for a hand-stamped, off-press feel -->
  <g transform="translate(170 180) rotate(-3)">

    <!-- shadow keyline: detaches the badge from ANY ground (incl. red) -->
    <circle cx="0" cy="0" r="153" fill="#0e0a07"/>

    <!-- outer disc -->
    <circle cx="0" cy="0" r="149" fill="#a4271f"/>

    <!-- brass rim ring -->
    <circle cx="0" cy="0" r="149" fill="none" stroke="#d4a14a" stroke-width="6"/>

    <!-- stamped notch teeth around the rim (squared, iron; stamp wear) -->
    <g fill="#fefae0">
      <g><rect x="-3" y="-150" width="6" height="13"/></g>
      <g transform="rotate(30)"><rect x="-3" y="-150" width="6" height="13"/></g>
      <g transform="rotate(60)"><rect x="-3" y="-150" width="6" height="13"/></g>
      <g transform="rotate(90)"><rect x="-3" y="-150" width="6" height="13"/></g>
      <g transform="rotate(120)"><rect x="-3" y="-150" width="6" height="13"/></g>
      <g transform="rotate(150)"><rect x="-3" y="-150" width="6" height="13"/></g>
      <g transform="rotate(180)"><rect x="-3" y="-150" width="6" height="13"/></g>
      <g transform="rotate(210)"><rect x="-3" y="-150" width="6" height="13"/></g>
      <g transform="rotate(240)"><rect x="-3" y="-150" width="6" height="13"/></g>
      <g transform="rotate(270)"><rect x="-3" y="-150" width="6" height="13"/></g>
      <g transform="rotate(300)"><rect x="-3" y="-150" width="6" height="13"/></g>
      <g transform="rotate(330)"><rect x="-3" y="-150" width="6" height="13"/></g>
      <g transform="rotate(15)"><rect x="-2.4" y="-150" width="5" height="9"/></g>
      <g transform="rotate(45)"><rect x="-2.4" y="-150" width="5" height="9"/></g>
      <g transform="rotate(75)"><rect x="-2.4" y="-150" width="5" height="9"/></g>
      <g transform="rotate(105)"><rect x="-2.4" y="-150" width="5" height="9"/></g>
      <g transform="rotate(135)"><rect x="-2.4" y="-150" width="5" height="9"/></g>
      <g transform="rotate(165)"><rect x="-2.4" y="-150" width="5" height="9"/></g>
      <g transform="rotate(195)"><rect x="-2.4" y="-150" width="5" height="9"/></g>
      <g transform="rotate(225)"><rect x="-2.4" y="-150" width="5" height="9"/></g>
      <g transform="rotate(255)"><rect x="-2.4" y="-150" width="5" height="9"/></g>
      <g transform="rotate(285)"><rect x="-2.4" y="-150" width="5" height="9"/></g>
      <g transform="rotate(315)"><rect x="-2.4" y="-150" width="5" height="9"/></g>
      <g transform="rotate(345)"><rect x="-2.4" y="-150" width="5" height="9"/></g>
    </g>

    <!-- ring-text band: two thin knockout hoops -->
    <circle cx="0" cy="0" r="134" fill="none" stroke="#fefae0" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="98"  fill="none" stroke="#fefae0" stroke-width="2.5"/>

    <!-- arched ring text (paper on red) -->
    <text fill="#fefae0" font-family="JetBrains Mono, monospace"
          font-size="17" letter-spacing="7" font-weight="700">
      <textPath href="#c3-arc-top" startOffset="50%" text-anchor="middle">OLD-SCHOOL IRON</textPath>
    </text>
    <text fill="#fefae0" font-family="JetBrains Mono, monospace"
          font-size="16" letter-spacing="6" font-weight="700">
      <textPath href="#c3-arc-bot" startOffset="50%" text-anchor="middle">MUMBAI · IRON IS RELIGION</textPath>
    </text>

    <!-- two stars at the band seam (champion) -->
    <g fill="#d4a14a">
      <use href="#c3-star" transform="translate(-116 0) scale(1.1)"/>
      <use href="#c3-star" transform="translate(116 0) scale(1.1)"/>
    </g>

    <!-- inner medallion (deep oxidised cinder) -->
    <circle cx="0" cy="0" r="94" fill="#6f1812"/>

    <!-- ====== THE HERO: a hung pair of gloves ====== -->
    <g transform="translate(0 -6)">
      <!-- hang ring + laces, knocked in paper -->
      <circle cx="0" cy="-58" r="9" fill="none" stroke="#fefae0" stroke-width="4.5"/>
      <path d="M0 -50 L-26 -22 M0 -50 L26 -22" stroke="#fefae0"
            stroke-width="4" fill="none" stroke-linecap="round"/>

      <!-- the gloves (paper), source glove centred at (30,36) -->
      <g fill="#fefae0" stroke="#6f1812" stroke-width="2">
        <g transform="translate(-34 12) rotate(-14) scale(1.55) translate(-30 -36)">
          <use href="#glove"/>
        </g>
        <g transform="translate(34 12) rotate(14) scale(-1.55 1.55) translate(-30 -36)">
          <use href="#glove"/>
        </g>
      </g>
    </g>

    <!-- stamped 'EST' tab beneath the gloves -->
    <g transform="translate(0 72)">
      <rect x="-34" y="-12" width="68" height="22" rx="2" fill="#d4a14a"/>
      <text x="0" y="4" text-anchor="middle" fill="#0e0a07"
            font-family="JetBrains Mono, monospace" font-size="13"
            letter-spacing="3" font-weight="700">EST·40</text>
    </g>
  </g>

  <!-- ================= WORDMARK ================= -->
  <g transform="translate(372 0)">
    <!-- GYMROB slab in paper with a hammered dark keyline -->
    <text x="0" y="172" fill="#fefae0"
          font-family="Alfa Slab One, Rockwell, serif" font-size="104"
          letter-spacing="0" stroke="#0e0a07" stroke-width="2.5"
          paint-order="stroke">GYMROB</text>

    <!-- red rule under the wordmark -->
    <rect x="4" y="198" width="438" height="6" fill="#a4271f"/>

    <!-- mono support line -->
    <text x="6" y="240" fill="#b49676"
          font-family="JetBrains Mono, monospace" font-size="19"
          letter-spacing="8" font-weight="700">ROBIN CARRUTHERS</text>

    <!-- single cool accent: @gymrob ring-blue chip -->
    <g transform="translate(360 222)">
      <rect x="0" y="0" width="82" height="26" rx="2" fill="#4687a6"/>
      <text x="41" y="18" text-anchor="middle" fill="#fefae0"
            font-family="JetBrains Mono, monospace" font-size="13"
            letter-spacing="2" font-weight="700">@gymrob</text>
    </g>
  </g>
</svg>

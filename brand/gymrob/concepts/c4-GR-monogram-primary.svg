<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img" aria-label="GYMROB — Robin Carruthers, Mumbai">
  <title>GYMROB · GR monogram primary lockup</title>

  <!-- ============================================================
       PRIMARY LOCKUP  ·  c4 "GR monogram" territory
       [ stamped GR tile ]  |  GYMROB  (Alfa Slab One)
                            |  ─────────────────────────
                            |  ROBIN CARRUTHERS · MUMBAI (mono)
       Transparent ground. Two inks only: mighty.red ground inside
       the tile, rocky.paper figure + type. One cool accent (ring
       rule tick) used exactly once.
       ============================================================ -->

  <!-- ====
       LEFT  ·  GR MONOGRAM TILE  (the exact icon-only mark, scaled)
       icon viewBox 0..256 mapped into a 256-box at x=44,y=52 -> 256w
       ==== -->
  <g transform="translate(44 52)">
    <g transform="rotate(-1.5 128 128)">
      <!-- droppable plate fill (enrichment only) -->
      <rect x="20" y="20" width="216" height="216" rx="8" fill="#a4271f"/>
      <!-- structural frame -->
      <rect x="33" y="33" width="190" height="190" rx="5" fill="none"
            stroke="#fefae0" stroke-width="8"/>
      <circle cx="50"  cy="50"  r="4" fill="#fefae0"/>
      <circle cx="206" cy="50"  r="4" fill="#fefae0"/>
      <circle cx="50"  cy="206" r="4" fill="#fefae0"/>
      <circle cx="206" cy="206" r="4" fill="#fefae0"/>

      <!-- G : solid slab, counter cut by evenodd -->
      <path fill="#fefae0" fill-rule="evenodd" d="
        M 126 62 L 78 62 Q 56 62 56 92 L 56 164 Q 56 194 78 194
        L 108 194 Q 126 194 126 176 L 126 118 L 92 118 L 92 142
        L 103 142 L 103 164 Q 103 169 98 169 L 86 169 Q 80 169 80 160
        L 80 96 Q 80 87 89 87 L 126 87 Z
      "/>
      <!-- R : solid slab stem + bowl + leg -->
      <path fill="#fefae0" fill-rule="evenodd" d="
        M 146 62 L 192 62 Q 212 62 212 92 Q 212 118 193 122
        L 212 194 L 186 194 L 174 134 L 174 194 L 146 194 Z
        M 174 87 L 189 87 Q 193 87 193 92 Q 193 99 189 99 L 174 99 Z
      "/>
    </g>
  </g>

  <!-- ====
       RIGHT  ·  WORDMARK STACK
       ==== -->

  <!-- GYMROB heavy slab, hammered. sized for Alfa Slab One width. -->
  <text x="330" y="180"
        font-family="Alfa Slab One, Rockwell, serif"
        font-size="94" letter-spacing="0.5"
        fill="#fefae0">GYMROB</text>

  <!-- divider rule: paper bar + single ring-blue tick (the one cool accent) -->
  <rect x="332" y="212" width="406" height="5" fill="#fefae0"/>
  <rect x="332" y="212" width="34"  height="5" fill="#4687a6"/>

  <!-- support line: JetBrains Mono, wide tracking, uppercase -->
  <text x="334" y="254"
        font-family="JetBrains Mono, monospace"
        font-size="22" letter-spacing="6.5"
        fill="#fefae0">ROBIN CARRUTHERS</text>

  <!-- est / place micro-line, mono, paper at reduced opacity for hierarchy -->
  <text x="334" y="288"
        font-family="JetBrains Mono, monospace"
        font-size="15.5" letter-spacing="8"
        fill="#fefae0" opacity="0.78">· MUMBAI · IRON IS RELIGION ·</text>

</svg>
